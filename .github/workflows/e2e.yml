name: Browser tests

# End-to-end money and compliance workflows in a real browser, against a local
# Supabase built from production's schema (e2e/supabase). No production access.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser tests (money and compliance)
    runs-on: ubuntu-24.04  # Playwright has no Chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_EXCLUDE: imgproxy,vector,logflare,studio,edge-runtime,realtime,postgres-meta,supavisor,mailpit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@11.7.0

      - name: Install dependencies
        run: npm ci

      # Only the services the tests use (database, auth, API, gateway, storage),
      # pulled from Docker Hub: anonymous pulls from public.ecr.aws hit its data
      # limit on shared GitHub runners. One retry for a transient pull error.
      - name: Start the local test database (production schema)
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          start() { npx supabase start --workdir e2e -x "$E2E_EXCLUDE"; }
          start || (sleep 30 && start)


      - name: Seed the test company
        run: node scripts/e2e/seed.mjs

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: Browser tests

# End-to-end money and compliance workflows in a real browser, against a local
# Supabase built from production's schema (e2e/supabase). No production access.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser tests (money and compliance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use pinned npm version
        run: npm install --global npm@11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Start the local test database (production schema)
        run: npx supabase start --workdir e2e

      - name: Seed the test company
        run: node scripts/e2e/seed.mjs

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
